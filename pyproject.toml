[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiaoqiao"
version = "0.1.0"
description = "个人 Python 项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qiaoqiao = "qiaoqiao.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
