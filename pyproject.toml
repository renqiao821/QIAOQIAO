[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiaoqiao"
version = "0.1.0"
description = "个人 Python 项目"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
qiaoqiao = "qiaoqiao.__main__:main"

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]
